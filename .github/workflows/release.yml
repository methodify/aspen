name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are linked against glibc 2.28 via cargo-zigbuild so
          # the binary runs on any distro from that era on (Ubuntu 20.04/22.04,
          # Debian 10+, RHEL 8+). Building on the runner's own glibc (2.39 on
          # ubuntu-latest) produced a binary older machines refused with
          # "version `GLIBC_2.39' not found".
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          # Cross-compiled: the hosted arm runner label is public-repo-only.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS builds are paused until the mac is in scope (they bill at
          # 10x on the private plan). Re-enable by uncommenting:
          # - os: macos-latest
          #   target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build console
        run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install zig + cargo-zigbuild
        if: matrix.zig
        run: pip3 install --user ziglang
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: build binaries (console embedded, glibc 2.28 baseline)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.28 -p aspen -p aspen-relay
      - name: build binaries (console embedded)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} -p aspen -p aspen-relay
      - name: stage release assets
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/aspen${ext}" "dist/aspen-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/aspen-relay${ext}" "dist/aspen-relay-${{ matrix.target }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: aspen-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum aspen-* > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "aspen ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
