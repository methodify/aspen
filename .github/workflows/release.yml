name: release

on:
  push:
    tags: ['v*']

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build console
        run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build binaries
        run: cargo build --release --target ${{ matrix.target }} -p aspen -p aspen-relay
      - uses: actions/upload-artifact@v4
        with:
          name: aspen-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/aspen*
            ui/dist
