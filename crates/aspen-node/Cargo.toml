[package]
name = "aspen-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aspen-core = { path = "../aspen-core" }
aspen-claude = { path = "../aspen-claude" }
aspen-codex = { path = "../aspen-codex" }
aspen-wire = { path = "../aspen-wire" }
mime_guess = "2"
regex-lite = "0.1"
tokio = { workspace = true }
shell-words = "1"
dunce = "1"
sha2 = "0.10"
serde_json = { workspace = true }
uuid = { workspace = true }
diffy = "0.4"
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", features = ["tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
if-addrs = "0.13"
web-push = { version = "0.10", default-features = false }
jwt-simple = "0.11"
base64_013 = { package = "base64", version = "0.13" }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
